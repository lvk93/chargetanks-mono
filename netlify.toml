# Netlify: Eleventy baut die Seite nach _site/; danach laufen Regressions- und Seitenpruefung.
# Die Angaben hier gelten vor denen in der Netlify-Oberflaeche.
[build]
  command = "npm run build && npm test"
  publish = "_site"

[build.environment]
  NODE_VERSION = "22"

# Anonyme Nutzungsstatistik: /api/event (netlify/functions/event.mjs) -> Supabase
# (Umgebungsvariablen SUPABASE_URL und SUPABASE_ANON_KEY in der Netlify-Oberflaeche)
[functions]
  directory = "netlify/functions"
